name: Alphabetical Order Check

on:
  pull_request:
    paths:
      - "README.md"

permissions:
  contents: read

jobs:
  alphabetical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-alphabetical.py README.md
