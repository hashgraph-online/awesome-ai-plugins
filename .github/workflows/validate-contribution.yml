name: Validate Plugin Contributions

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SCANNER_GUIDE.md"
      - "scripts/validate-contribution.py"
      - "scripts/backfill-claim-notices.py"
      - "scripts/post-claim-notice.py"
      - "scripts/publish-open-pr-checks.py"
      - "scripts/sanitize-scan-report.py"
      - "tests/test-sanitize-scan-report.py"
      - "tests/test-post-claim-notice.py"
      - "tests/test-backfill-claim-notices.py"
      - "tests/test-publish-open-pr-checks.py"
      - "tests/test-validate-contribution.py"
      - ".github/workflows/validate-contribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check contribution requirements
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.entries.outputs.matrix }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Test contributor automation messaging
        run: python3 -m unittest tests/test-post-claim-notice.py tests/test-backfill-claim-notices.py tests/test-publish-open-pr-checks.py tests/test-sanitize-scan-report.py tests/test-validate-contribution.py
      - name: Validate changed catalog entries
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-alphabetical.py README.md
          python3 scripts/validate-contribution.py \
            --base-ref "$BASE_REF" \
            --matrix-output "$RUNNER_TEMP/contributions.json"
      - name: Export scanner matrix
        id: entries
        env:
          MATRIX_FILE: ${{ runner.temp }}/contributions.json
        run: echo "matrix=$(cat "$MATRIX_FILE")" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.contribution.owner }}/${{ matrix.contribution.repo }}
    needs: validate
    if: needs.validate.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contribution: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - name: Check out trusted report publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out contributed repository
        env:
          CONTRIBUTION_URL: https://github.com/${{ matrix.contribution.owner }}/${{ matrix.contribution.repo }}.git
        run: git clone --depth 1 "$CONTRIBUTION_URL" "$RUNNER_TEMP/contributed"
      - name: Run HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@c96833de5070fab4e564010b5ab6e3c3d7e07a3e # v1.2.806
        with:
          plugin_dir: ${{ runner.temp }}/contributed
          mode: scan
          format: json
          output: ${{ runner.temp }}/source-scan.json
          min_score: 80
          # Finding severities are advisory; the score is the listing gate.
          fail_on_severity: none
          pr_comment: off
      - name: Sanitize finding report
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/source-scan.json" ]]; then
            python3 scripts/sanitize-scan-report.py --input "$RUNNER_TEMP/source-scan.json" \
              --root "$RUNNER_TEMP/contributed" --output-dir "$RUNNER_TEMP/public-findings" \
              --source-commit "$(git -C "$RUNNER_TEMP/contributed" rev-parse HEAD)"
            cat "$RUNNER_TEMP/public-findings/findings.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scanner report unavailable; inspect the failed scanner job before retrying." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-findings-${{ matrix.contribution.owner }}-${{ matrix.contribution.repo }}
          path: ${{ runner.temp }}/public-findings/
          if-no-files-found: ignore
          retention-days: 30
