name: Backfill Contribution Gate Comments

# Closed pull requests are never swept again, so their gate comments keep the
# format that was current when they closed. Only a workflow token can edit the
# bot's comments, which is why this runs as a manual workflow.
on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "Closed PR numbers to re-render, separated by spaces or commas (max 100)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backfill-gate-comments
  cancel-in-progress: false

jobs:
  backfill:
    name: Re-render closed PR gate comments
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
      - name: Re-render gate comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKFILL_PRS: ${{ inputs.pr_numbers }}
          BACKFILL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/backfill-gate-comments.py
