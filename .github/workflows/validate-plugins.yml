name: Validate marketplace artifacts

on:
  pull_request:
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - scripts/generate_plugins_json.py
      - tests/test-generate-plugins-json.py
      - scripts/post-claim-notice.py
      - scripts/backfill-claim-notices.py
      - tests/test-post-claim-notice.py
      - tests/test-claim-notice-api-key.py
      - tests/test-backfill-claim-notices.py
      - requirements-dev.txt
      - .python-version
  push:
    branches: [main]
    paths:
      - README.md
      - plugins.json
      - .agents/plugins/marketplace.json
      - scripts/generate_plugins_json.py
      - tests/test-generate-plugins-json.py
      - scripts/post-claim-notice.py
      - scripts/backfill-claim-notices.py
      - tests/test-post-claim-notice.py
      - tests/test-claim-notice-api-key.py
      - tests/test-backfill-claim-notices.py
      - requirements-dev.txt
      - .python-version

permissions:
  contents: read

jobs:
  validate:
    # Python 3.12.10 has no Ubuntu 26.04 build; keep the pinned runtime supported.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Install pinned local dependency
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Run offline generator and catalog checks
        env:
          GENERATED_DIR: ${{ runner.temp }}/generated-feeds
        run: |
          python3 -m unittest tests/test-generate-plugins-json.py
          python3 -m unittest tests/test-post-claim-notice.py tests/test-backfill-claim-notices.py tests/test-claim-notice-api-key.py
          python3 scripts/check-alphabetical.py README.md
          python3 scripts/generate_plugins_json.py --offline --output-dir "$GENERATED_DIR"
          python3 -c 'import json, os; from pathlib import Path; root=Path(os.environ["GENERATED_DIR"]); assert json.loads((root / "plugins.json").read_text())["total"] > 0; assert json.loads((root / ".agents/plugins/marketplace.json").read_text())["plugins"]'
