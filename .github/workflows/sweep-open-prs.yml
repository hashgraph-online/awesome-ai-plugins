name: Sweep Open Plugin Contributions

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional open PR number; omit to sweep every open PR"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    name: Validate open contribution requirements
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.export.outputs.matrix }}
      has_failures: ${{ steps.export.outputs.has_failures }}
      results: ${{ steps.export.outputs.results }}
    steps:
      - name: Check out validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
      - name: Validate open PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          MATRIX_FILE: ${{ runner.temp }}/open-pr-matrix.json
          REPORT_FILE: ${{ runner.temp }}/open-pr-report.md
          STATUS_FILE: ${{ runner.temp }}/open-pr-status.json
        run: |
          validator_args=(
            --open-prs
            --repository "$GITHUB_REPOSITORY"
            --matrix-output "$MATRIX_FILE"
            --report-output "$REPORT_FILE"
            --status-output "$STATUS_FILE"
          )
          if [[ -n "$PR_NUMBER" ]]; then
            validator_args+=(--pr-number "$PR_NUMBER")
          fi
          python3 scripts/validate-contribution.py "${validator_args[@]}"
      - name: Export validation results
        id: export
        env:
          MATRIX_FILE: ${{ runner.temp }}/open-pr-matrix.json
          STATUS_FILE: ${{ runner.temp }}/open-pr-status.json
        run: |
          echo "matrix=$(cat "$MATRIX_FILE")" >> "$GITHUB_OUTPUT"
          echo "has_failures=$(jq -r '.has_failures' "$STATUS_FILE")" >> "$GITHUB_OUTPUT"
          echo "results=$(jq -c '.results' "$STATUS_FILE")" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan PR #${{ matrix.contribution.pr_number }} source
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contribution: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out trusted report publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check out contributed repository
        env:
          CONTRIBUTION_URL: https://github.com/${{ matrix.contribution.owner }}/${{ matrix.contribution.repo }}.git
        run: git clone --depth 1 "$CONTRIBUTION_URL" "$RUNNER_TEMP/contributed"
      - name: Run HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@c96833de5070fab4e564010b5ab6e3c3d7e07a3e # v1.2.806
        with:
          plugin_dir: ${{ runner.temp }}/contributed
          mode: scan
          format: json
          output: ${{ runner.temp }}/source-scan.json
          min_score: 75
          # Finding severities are advisory; the score is the listing gate.
          fail_on_severity: none
          pr_comment: off
      - name: Sanitize finding report
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/source-scan.json" ]]; then
            python3 scripts/sanitize-scan-report.py --input "$RUNNER_TEMP/source-scan.json" \
              --root "$RUNNER_TEMP/contributed" --output-dir "$RUNNER_TEMP/public-findings" \
              --source-commit "$(git -C "$RUNNER_TEMP/contributed" rev-parse HEAD)"
            cat "$RUNNER_TEMP/public-findings/findings.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scanner report unavailable; inspect the failed scanner job before retrying." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-findings-pr-${{ matrix.contribution.pr_number }}-${{ matrix.contribution.owner }}-${{ matrix.contribution.repo }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-findings/
          if-no-files-found: ignore
          retention-days: 30

  gate:
    name: Open contribution gate
    needs:
      - discover
      - scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report sweep result
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          HAS_VALIDATION_FAILURES: ${{ needs.discover.outputs.has_failures }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          if [[ "$DISCOVER_RESULT" != "success" ]]; then
            echo "Open-PR discovery failed."
            exit 1
          fi
          if [[ "$HAS_VALIDATION_FAILURES" == "true" ]]; then
            echo "One or more open contributions failed catalog validation."
            exit 1
          fi
          if [[ "$SCAN_RESULT" != "success" && "$SCAN_RESULT" != "skipped" ]]; then
            echo "One or more centralized scans did not establish a score of at least 75; those contributions remain blocked. Finding severities are advisory."
            exit 1
          fi
          echo "Catalog validation and centralized score checks passed. Source-repository scanner CI is optional."

  publish:
    name: Publish per-PR contribution checks
    needs:
      - discover
      - scan
      - gate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download sanitized scan verdicts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scan-findings-pr-*
          path: ${{ runner.temp }}/scan-findings
          merge-multiple: false
      - name: Publish checks on PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SCAN_FINDINGS_DIR: ${{ runner.temp }}/scan-findings
          OPEN_PR_RESULTS: ${{ needs.discover.outputs.results || '[]' }}
          SWEEP_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/publish-open-pr-checks.py
