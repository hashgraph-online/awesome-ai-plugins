name: Sync from upstream registries

on:
  push:
    branches: [main]
    paths:
      - README.md
  repository_dispatch:
    types: [sync-to-ai-plugins]

# A merged README addition should be checked against the public feeds. This
# push-triggered job must NEVER publish catalog metadata without review.
permissions:
  contents: read

concurrency:
  group: registry-feed-sync-main
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    name: Detect feed drift after a merged README change
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compare published feeds without modifying them
        run: python3 scripts/generate_plugins_json.py --require-upstreams --check

  sync:
    if: github.event_name == 'repository_dispatch'
    name: Sync from upstream plugin registries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout awesome-ai-plugins
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Regenerate combined JSON from all upstream sources
        run: python3 scripts/generate_plugins_json.py --require-upstreams

      - name: Commit and push
        run: |
          if ! git diff --quiet -- plugins.json .agents/plugins/marketplace.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins.json .agents/plugins/marketplace.json
            git commit -m "chore: sync from upstream registries"
            git push
          else
            echo "No changes to sync"
          fi
